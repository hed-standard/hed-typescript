---
name: Typos

on:
  push:
    branches:
      - main
      - fix_required
  pull_request:
    branches:
      - main
      - fix_required

permissions:
  contents: read

jobs:
  typos:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e #10.3.2
        with:
          enable-cache: false

      - name: Run typos
        run: uvx typos --config .typos.toml
